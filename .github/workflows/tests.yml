name: Car-Connect Tests

# Manual only — run from Actions tab → "Car-Connect Tests" → Run workflow.
on:
  workflow_dispatch:

jobs:
  build-and-test:
    timeout-minutes: 30
    name: Build and Test
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.7.0
        with:
          xcode-version: latest-stable

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Car-Connect.xcodeproj \
            -scheme Car-Connect

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project Car-Connect.xcodeproj \
            -scheme Car-Connect \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            | xcpretty

      - name: Test
        run: |
          xcodebuild test-without-building \
            -project Car-Connect.xcodeproj \
            -scheme Car-Connect \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            | xcpretty
